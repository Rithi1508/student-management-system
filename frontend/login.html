<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Student Portal</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #eef4ff, #dce8ff);
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            padding: 36px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 18px 55px rgba(25, 55, 110, 0.12);
        }

        .login-brand {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .login-card h1 {
            margin: 0 0 10px;
            color: #172554;
            font-size: 28px;
        }

        .login-subtitle {
            margin-bottom: 28px;
            color: #64748b;
            line-height: 1.6;
        }

        .login-form label {
            display: block;
            margin: 18px 0 8px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .login-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .login-form input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .login-submit {
            width: 100%;
            margin-top: 26px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-submit:hover {
            background: #1d4ed8;
        }

        .login-message {
            margin-top: 16px;
            color: #b45309;
            font-size: 14px;
            line-height: 1.5;
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 26px 22px;
            }
        }
    </style>
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="login-brand">S</div>

            <h1>Welcome back!</h1>

            <p class="login-subtitle">
                Sign in to your Student Portal to access your academic information.
            </p>

            <form class="login-form" id="loginForm">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="login-submit">
                    Sign In
                </button>

                <p
                    id="loginMessage"
                    class="login-message"
                    role="status"
                    aria-live="polite">
                </p>

            </form>

            <div class="login-footer">
                Student Management System
            </div>

        </section>

    </main>

    
</body>
</html>
<script>

document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("loginMessage");
    const button = document.querySelector(".login-submit");

    message.textContent = "";
    button.disabled = true;
    button.textContent = "Signing in...";

    try {
        const response = await fetch("http://127.0.0.1:5000/api/auth/login", {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            message.textContent = data.message || "Login failed. Please try again.";
            return;
        }

        // Keep the student's display information for the frontend.
        // Flask's session cookie is used for authentication.
        sessionStorage.setItem("studentData", JSON.stringify({
            name: data.student.full_name,
            email: data.student.email,
            studentId: data.student.id
        }));

        window.location.href = "dashboard.html";

    } catch (error) {
        console.error("Login request failed:", error);
        message.textContent =
            "Cannot connect to the server. Please make sure Flask is running.";
    } finally {
        button.disabled = false;
        button.textContent = "Sign In";
    }
});
</script>
